<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Calendar | Smart Task Manager</title>


    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- FullCalendar -->
    <link
            href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css"
            rel="stylesheet">

    <!-- Main Site CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

    <!-- Calendar CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/calendar.css}">

</head>


<body>


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<div th:replace="fragments/navbar :: body"></div>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="calendar-page">


    <!-- =================================================
         PAGE HEADER
    ================================================== -->

    <section class="calendar-header">


        <div class="calendar-heading">


            <div class="calendar-eyebrow">

                <i class="bi bi-calendar3"></i>

                PLANNING

            </div>


            <h1>
                Task Calendar
            </h1>


            <p>
                Organise your workload and keep track of upcoming deadlines.
            </p>


        </div>



        <a
                th:href="@{/tasks/new}"
                class="calendar-new-task">

            <i class="bi bi-plus-lg"></i>

            <span>
                New Task
            </span>

        </a>


    </section>



    <!-- =================================================
         CALENDAR
    ================================================== -->

    <section class="calendar-panel">


        <!-- Calendar top -->

        <div class="calendar-panel-top">


            <div class="calendar-panel-title">

                <div class="calendar-panel-icon">

                    <i class="bi bi-calendar-week"></i>

                </div>


                <div>

                    <h2>
                        Schedule
                    </h2>

                    <p>
                        Your tasks by due date
                    </p>

                </div>

            </div>


            <div class="calendar-hint">

                <i class="bi bi-info-circle"></i>

                Click a task to view it

            </div>


        </div>



        <!-- Actual calendar -->

        <div class="calendar-wrapper">

            <div id="calendar"></div>

        </div>


    </section>


</main>



<!-- =====================================================
     FULLCALENDAR JAVASCRIPT
===================================================== -->

<script
        src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js">
</script>



<script th:inline="javascript">

    document.addEventListener('DOMContentLoaded', function () {

        const calendarElement =
            document.getElementById('calendar');


        const calendar =
            new FullCalendar.Calendar(
                calendarElement,
                {

                    initialView: 'dayGridMonth',

                    height: 'auto',

                    contentHeight: 'auto',

                    expandRows: true,


                    headerToolbar: {

                        left: 'prev,next today',

                        center: 'title',

                        right: 'dayGridMonth,timeGridWeek'

                    },


                    buttonText: {

                        today: 'Today',

                        month: 'Month',

                        week: 'Week'

                    },


                    events: /*[[${calendarEvents}]]*/ [],


                    eventClick: function (info) {

                        info.jsEvent.preventDefault();

                        if (info.event.url) {

                            window.location.href =
                                info.event.url;

                        }

                    }

                }
            );


        calendar.render();

    });

</script>


</body>

</html>
