<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">

<head>

  <title>Create Account - Smart Task Manager</title>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        th:href="@{/css/auth.css}">

</head>

<body>

<div class="container">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow-lg mt-5">

        <div class="card-body p-5">

          <h2 class="text-center mb-4">

            Smart Task Manager

          </h2>

          <h5 class="text-center text-muted mb-4">

            Create your account

          </h5>

          <form
                  th:action="@{/register}"
                  th:object="${registerRequest}"
                  method="post">

            <!-- First Name -->
            <div class="mb-3">

              <label for="firstName">First Name</label>

              <input
                      id="firstName"
                      class="form-control"
                      type="text"
                      th:field="*{firstName}"
                      required>

              <div
                      class="text-danger"
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}">
              </div>

            </div>

            <!-- Last Name -->
            <div class="mb-3">

              <label for="lastName">Last Name</label>

              <input
                      id="lastName"
                      class="form-control"
                      type="text"
                      th:field="*{lastName}"
                      required>

              <div
                      class="text-danger"
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}">
              </div>

            </div>

            <!-- Email -->
            <div class="mb-3">

              <label for="email">Email</label>

              <input
                      id="email"
                      class="form-control"
                      type="email"
                      th:field="*{email}"
                      required>

              <div
                      class="text-danger"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
              </div>

            </div>

            <!-- Password -->
            <div class="mb-4">

              <label for="password">Password</label>

              <input
                      id="password"
                      class="form-control"
                      type="password"
                      th:field="*{password}"
                      required>

              <div
                      class="text-danger"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}">
              </div>

            </div>

            <!-- Register Button -->
            <button
                    type="submit"
                    class="btn btn-primary w-100">

              Register

            </button>

          </form>

          <hr>

          <p class="text-center">

            Already have an account?

            <a th:href="@{/login}">
              Login
            </a>

          </p>

        </div>

      </div>

    </div>

  </div>

</div>

</body>

</html>
