<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title
          th:text="${taskId == null ? 'Add Task | Smart Task Manager' : 'Edit Task | Smart Task Manager'}">
    Task | Smart Task Manager
  </title>

  <!-- Bootstrap -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Navbar CSS -->
  <link
          rel="stylesheet"
          th:href="@{/css/navbar.css}">

  <!-- Task Form CSS -->
  <link
          rel="stylesheet"
          th:href="@{/css/task-form.css}">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div th:replace="fragments/navbar :: body"></div>



<!-- =====================================================
     PAGE
===================================================== -->

<main class="task-form-page">

  <div class="task-form-container">


    <!-- =================================================
         PAGE HEADER
    ================================================== -->

    <div class="task-form-header">

      <div>

        <div class="task-form-eyebrow">

          <i class="bi bi-check2-square"></i>

          TASK MANAGEMENT

        </div>


        <h1
                th:text="${taskId == null ? 'Create a New Task' : 'Edit Task'}">

          Edit Task

        </h1>


        <p
                th:text="${taskId == null
                        ? 'Create a task and keep your work organised.'
                        : 'Update the details of your task below.'}">

          Update the details of your task below.

        </p>

      </div>


      <!-- BACK -->

      <a
              th:href="@{/tasks}"
              class="back-button">

        <i class="bi bi-arrow-left"></i>

        <span>Back to Tasks</span>

      </a>

    </div>



    <!-- =================================================
         FORM CARD
    ================================================== -->

    <section class="task-form-card">


      <!-- CARD HEADER -->

      <div class="task-form-card-header">

        <div class="form-title-icon">

          <i
                  th:class="${taskId == null
                            ? 'bi bi-plus-lg'
                            : 'bi bi-pencil-square'}">
          </i>

        </div>


        <div>

          <h2
                  th:text="${taskId == null
                            ? 'Task Details'
                            : 'Update Task Details'}">

            Update Task Details

          </h2>

          <p>
            Add the information below to manage your task.
          </p>

        </div>

      </div>



      <!-- =================================================
           FORM
      ================================================== -->

      <form
              th:action="${taskId == null}
                    ? @{/tasks}
                    : @{/tasks/{id}(id=${taskId})}"
              th:object="${taskRequest}"
              method="post">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div class="form-group">

          <label for="title">
            Task Title
          </label>

          <div class="input-wrapper">

            <i class="bi bi-card-text"></i>

            <input
                    id="title"
                    type="text"
                    th:field="*{title}"
                    placeholder="Enter your task title"
                    autocomplete="off"
                    required>

          </div>

        </div>



        <!-- =================================================
             DESCRIPTION
        ================================================== -->

        <div class="form-group">

          <label for="description">
            Description
          </label>

          <div class="textarea-wrapper">

            <i class="bi bi-text-paragraph"></i>

            <textarea
                    id="description"
                    th:field="*{description}"
                    placeholder="Describe what needs to be done..."
                    rows="5"></textarea>

          </div>

        </div>



        <!-- =================================================
             PRIORITY + DATE
        ================================================== -->

        <div class="form-row">


          <!-- PRIORITY -->

          <div class="form-group">

            <label for="priority">
              Priority
            </label>

            <div class="input-wrapper">

              <i class="bi bi-flag"></i>

              <select
                      id="priority"
                      th:field="*{priority}">

                <option value="LOW">
                  Low
                </option>

                <option value="MEDIUM">
                  Medium
                </option>

                <option value="HIGH">
                  High
                </option>

              </select>

              <i class="bi bi-chevron-down select-arrow"></i>

            </div>

          </div>



          <!-- DUE DATE -->

          <div class="form-group">

            <label for="dueDate">
              Due Date
            </label>

            <div class="input-wrapper">

              <i class="bi bi-calendar3"></i>

              <input
                      id="dueDate"
                      type="date"
                      th:field="*{dueDate}">

            </div>

          </div>

        </div>



        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="form-actions">


          <a
                  th:href="@{/tasks}"
                  class="cancel-button">

            Cancel

          </a>


          <button
                  type="submit"
                  class="save-task-button">

            <i
                    th:class="${taskId == null
                                ? 'bi bi-plus-lg'
                                : 'bi bi-check-lg'}">
            </i>

            <span
                    th:text="${taskId == null
                                ? 'Create Task'
                                : 'Save Changes'}">

                            Save Changes

                        </span>

          </button>


        </div>


      </form>

    </section>



    <!-- =================================================
         SMALL FOOTER NOTE
    ================================================== -->

    <div class="task-form-note">

      <i class="bi bi-shield-check"></i>

      Your task information is saved securely.

    </div>


  </div>

</main>


</body>

</html>
