<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Tasks | Smart Task Manager</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

    <!-- Tasks CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/tasks.css}">

</head>


<body class="tasks-page">


<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<div th:replace="fragments/navbar :: body"></div>



<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="tasks-container">


    <!-- PAGE HEADER -->

    <div class="tasks-header">

        <div class="tasks-heading">

            <span class="tasks-eyebrow">
                <i class="bi bi-check2-square"></i>
                Task Management
            </span>

            <h1 class="fw-bold mb-1">
                My Tasks
            </h1>

            <p class="text-muted mb-0">
                Manage and organise all your tasks in one place.
            </p>

        </div>


        <a
                th:href="@{/tasks/new}"
                class="tasks-new-btn">

            <i class="bi bi-plus-lg me-1"></i>

            New Task

        </a>

    </div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="tasks-search-panel">

        <form
                class="tasks-search-form"
                th:action="@{/tasks/search}"
                method="get">

            <div class="tasks-search-input-wrapper">

                <input
                        type="text"
                        name="keyword"
                        class="tasks-search-input"
                        placeholder="Search your tasks...">

            </div>


            <button
                    type="submit"
                    class="tasks-search-btn">

                <i class="bi bi-search"></i>

                Search

            </button>

        </form>

    </div>



    <!-- =================================================
         FILTERS
    ================================================== -->

    <div class="tasks-filter-bar">

    <span class="tasks-filter-label">
        Filter
    </span>

        <a
                th:href="@{/tasks}"
                class="task-filter active">
            All
        </a>

        <a
                th:href="@{/tasks/filter/high}"
                class="task-filter">

            <span class="task-filter-dot high"></span>

            High

        </a>

        <a
                th:href="@{/tasks/filter/medium}"
                class="task-filter">

            <span class="task-filter-dot medium"></span>

            Medium

        </a>

        <a
                th:href="@{/tasks/filter/low}"
                class="task-filter">

            <span class="task-filter-dot low"></span>

            Low

        </a>

    </div>



    <!-- =================================================
         TASK TABLE
    ================================================== -->

    <div class="tasks-table-card">

        <div class="table-responsive">

            <table class="tasks-table">


                    <!-- TABLE HEADER -->

                <thead>

                <tr>

                    <th>Task</th>

                    <th>Description</th>

                    <th>Priority</th>

                    <th>Status</th>

                    <th>Due Date</th>

                    <th>Actions</th>

                </tr>

                </thead>



                    <!-- TABLE BODY -->

                    <tbody>


                    <!-- EMPTY -->

                    <tr th:if="${#lists.isEmpty(tasks)}">

                        <td colspan="6">

                            <div class="tasks-empty">

                                <div class="tasks-empty-icon">

                                    <i class="bi bi-clipboard-x"></i>

                                </div>

                                <h4>
                                    No tasks found
                                </h4>

                                <p>
                                    Create a new task to get started.
                                </p>

                            </div>

                        </td>

                    </tr>



                    <!-- TASK -->

                    <tr th:each="task : ${tasks}">


                        <!-- TITLE -->

                        <td>

                            <div class="task-name">

                                <div class="task-name-icon">

                                    <i class="bi bi-check2-square"></i>

                                </div>

                                <span
                                        class="task-name-text"
                                        th:text="${task.title}">

                                    Task title

                                </span>

                            </div>

                        </td>



                        <!-- DESCRIPTION -->

                        <td>

                            <span
                                    class="text-description"
                                    th:text="${task.description}">

                                Description

                            </span>

                        </td>



                        <!-- PRIORITY -->

                        <td>

                            <span
                                    th:if="${task.priority.name() == 'HIGH'}"
                                    class="task-badge priority-high">

                                High

                            </span>

                            <span
                                    th:if="${task.priority.name() == 'MEDIUM'}"
                                    class="task-badge priority-medium">

                                Medium

                            </span>

                            <span
                                    th:if="${task.priority.name() == 'LOW'}"
                                    class="task-badge priority-low">

                                Low

                            </span>

                        </td>



                        <!-- STATUS -->

                        <td>

                            <span
                                    th:if="${task.status.name() == 'PENDING'}"
                                    class="task-badge status-pending">

                                Pending

                            </span>

                            <span
                                    th:if="${task.status.name() == 'IN_PROGRESS'}"
                                    class="task-badge status-progress">

                                In Progress

                            </span>

                            <span
                                    th:if="${task.status.name() == 'COMPLETED'}"
                                    class="task-badge status-completed">

                                Completed

                            </span>

                        </td>



                        <!-- DUE DATE -->

                        <td>

                            <span class="task-due-date">

                                <i class="bi bi-calendar3"></i>

                                <span th:text="${task.dueDate}">
                                    Due date
                                </span>

                            </span>

                        </td>



                        <!-- ACTIONS -->

                        <td>

                            <div class="task-actions">

                                <a
                                        th:href="@{/tasks/{id}/edit(id=${task.id})}"
                                        class="task-action edit"
                                        title="Edit task">

                                    <i class="bi bi-pencil"></i>

                                </a>

                                <form
                                        th:action="@{/tasks/{id}/delete(id=${task.id})}"
                                        method="post"
                                        class="delete-task-form"
                                        onsubmit="return confirm('Are you sure you want to delete this task?');">

                                    <button
                                            type="submit"
                                            class="task-action delete"
                                            title="Delete task">

                                        <i class="bi bi-trash"></i>

                                    </button>

                                </form>

                            </div>

                        </td>


                    </tr>


                    </tbody>

                </table>

            </div>

        </div>



</main>


</body>

</html>
